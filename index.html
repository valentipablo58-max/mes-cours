<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cours - L3 Maths</title>
    <style>
        body {
            background: linear-gradient(rgba(9, 10, 15, 0.75), rgba(9, 10, 15, 0.85)), 
                        url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=1920&auto=format&fit=crop&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            max-width: 1100px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #f0f6fc;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }
        p {
            color: #8b949e;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        /* Scène adaptée pour espacer correctement les cartes sans superposition */
        .orbit-scene {
            position: relative;
            width: 900px;
            height: 380px;
            margin-bottom: 10px;
        }

        /* Style des cartes */
        .card {
            position: absolute;
            width: 210px;
            height: 280px;
            background: rgba(22, 27, 34, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
            left: 50%;
            top: 50%;
            margin-left: -105px;
            margin-top: -140px;
        }

        .card:hover {
            border-color: #58a6ff;
            box-shadow: 0 20px 45px rgba(88, 166, 255, 0.4);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .card-desc {
            font-size: 0.75rem;
            color: #8b949e;
        }

        footer {
            color: #8b949e;
            font-size: 0.85rem;
            margin-top: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PABLO VALENTI</h1>
        <p>Espace de cours — L3 Mathématiques</p>

        <!-- Scène orbitale (4 cartes de maths bien espacées) -->
        <div class="orbit-scene" id="orbitScene">
            
            <!-- Cours 1 : Algèbre Commutative -->
            <div class="card" onclick="selectCard(0)" data-href="cours/algebre.html">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80" alt="Algèbre">
                <div class="card-body">
                    <div class="card-title">📘 Algèbre Commutative</div>
                    <div class="card-desc">Anneaux, idéaux et modules.</div>
                </div>
            </div>

            <!-- Cours 2 : Intégration -->
            <div class="card" onclick="selectCard(1)" data-href="cours/integration.html">
                <img src="https://images.unsplash.com/photo-1509228468518-180dd4864904?w=600&auto=format&fit=crop&q=80" alt="Intégration">
                <div class="card-body">
                    <div class="card-title">📈 Intégration</div>
                    <div class="card-desc">Théorie de la mesure et Lebesgue.</div>
                </div>
            </div>

            <!-- Cours 3 : Probabilité -->
            <div class="card" onclick="selectCard(2)" data-href="cours/probabilite.html">
                <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format&fit=crop&q=80" alt="Probabilité">
                <div class="card-body">
                    <div class="card-title">🎲 Probabilité</div>
                    <div class="card-desc">Variables aléatoires et lois.</div>
                </div>
            </div>

            <!-- Cours 4 : Équations Différentielles -->
            <div class="card" onclick="selectCard(3)" data-href="cours/équa dif.html">
                <img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=600&auto=format&fit=crop&q=80" alt="Équations Différentielles">
                <div class="card-body">
                    <div class="card-title">📉 Équations Différentielles</div>
                    <div class="card-desc">Systèmes dynamiques et résolutions.</div>
                </div>
            </div>

        </div>

        <footer>
            UBO Brest — Propulsé par GitHub Pages
        </footer>
    </div>

    <script>
        const cards = Array.from(document.querySelectorAll('.card'));
        let activeIndex = 0; 

        function updatePositions() {
            const total = cards.length;
            
            cards.forEach((card, i) => {
                let diff = (i - activeIndex + total) % total;
                
                if (diff === 0) {
                    // Carte centrale active (mise en avant nette)
                    card.style.transform = "translate(0px, 0px) scale(1)";
                    card.style.zIndex = "50";
                    card.style.opacity = "1";
                    card.style.filter = "blur(0px)";
                    card.style.pointerEvents = "auto";
                } else {
                    // Calcul d'une orbite elliptique large pour éviter toute superposition
                    let angle = (diff / total) * 2 * Math.PI - Math.PI / 2;
                    let radiusX = 310; // Écartement horizontal accru
                    let radiusY = 50;  // Aplatissement vertical élégant

                    let x = Math.cos(angle) * radiusX;
                    let y = Math.sin(angle) * radiusY;

                    card.style.transform = `translate(${x}px, ${y}px) scale(0.75)`;
                    card.style.zIndex = "10";
                    card.style.opacity = "0.5";
                    card.style.filter = "blur(0.5px)";
                    card.style.pointerEvents = "auto";
                }
            });
        }

        function selectCard(index) {
            if (index === activeIndex) {
                window.location.href = cards[index].getAttribute('data-href');
            } else {
                activeIndex = index;
                updatePositions();
            }
        }

        updatePositions();
    </script>

</body>
</html>
