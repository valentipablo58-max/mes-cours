<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cours - L3 Maths</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container { text-align: center; max-width: 900px; padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; color: #f0f6fc; }
        p { color: #8b949e; margin-bottom: 40px; font-size: 1.1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .card {
            background: linear-gradient(135deg, rgba(33, 38, 45, 0.8), rgba(22, 27, 34, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px 15px;
            text-decoration: none;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            box-shadow: 0 12px 40px 0 rgba(88, 166, 255, 0.2);
            background: linear-gradient(135deg, rgba(48, 54, 61, 0.9), rgba(33, 38, 45, 1));
        }
        .icon { font-size: 2.5rem; margin-bottom: 15px; }
        .card-title { font-weight: 600; font-size: 1rem; text-align: center; }
        footer { margin-top: 50px; color: #484f58; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PABLO VALENTI</h1>
        <p>Espace de consultation — L3 Mathématiques</p>

        <div class="grid">
            <!-- Lien vers la page d'algèbre -->
            <a href="cours/algebre.html" class="card">
                <div class="icon">📘</div>
                <div class="card-title">Algèbre Commutative</div>
            </a>

            <!-- Lien vers la page d'intégration -->
            <a href="cours/integration.html" class="card">
                <div class="icon">📈</div>
                <div class="card-title">Intégration</div>
            </a>

            <!-- Lien vers la page de proba -->
            <a href="cours/probabilite.html" class="card">
                <div class="icon">🎲</div>
                <div class="card-title">Probabilité</div>
            </a>

            <!-- Lien vers la page d'équa diff -->
            <a href="cours/equadiff.html" class="card">
                <div class="icon">📉</div>
                <div class="card-title">Équations Différentielles</div>
            </a>
        </div>

        <footer>
            UBO Brest — Propulsé par GitHub Pages
        </footer>
    </div>

</body>
</html>
