<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cours - L3 Maths</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #f0f6fc;
        }
        p {
            color: #8b949e;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        /* Scène orbitale (type ellipse) */
        .orbit-scene {
            position: relative;
            width: 750px;
            height: 420px;
            margin-bottom: 10px;
        }

        /* Style des cartes */
        .card {
            position: absolute;
            width: 220px;
            height: 290px;
            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.5s ease, opacity 0.5s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
            left: 50%;
            top: 50%;
            margin-left: -110px;
            margin-top: -145px;
        }

        /* Zoom stable au survol */
        .card:hover {
            transform: scale(1.06) !important;
            border-color: #58a6ff;
            box-shadow: 0 15px 40px rgba(88, 166, 255, 0.3);
            z-index: 100 !important;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .card-desc {
            font-size: 0.75rem;
            color: #8b949e;
        }

        footer {
            color: #484f58;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PABLO VALENTI</h1>
        <p>Espace de cours — L3 Mathématiques</p>

        <!-- Scène en orbite elliptique -->
        <div class="orbit-scene" id="orbitScene">
            
            <!-- Cours 1 -->
            <div class="card" onclick="selectCard(0)" data-href="cours/algebre.html">
                <img src="https://images.unsplash.com/photo-1509228468518-180dd4864904?w=600&auto=format&fit=crop&q=80" alt="Algèbre">
                <div class="card-body">
                    <div class="card-title">📘 Algèbre Commutative</div>
                    <div class="card-desc">Anneaux, idéaux et modules.</div>
                </div>
            </div>

            <!-- Cours 2 -->
            <div class="card" onclick="selectCard(1)" data-href="cours/integration.html">
                <img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=600&auto=format&fit=crop&q=80" alt="Intégration">
                <div class="card-body">
                    <div class="card-title">📈 Intégration</div>
                    <div class="card-desc">Théorie de la mesure et Lebesgue.</div>
                </div>
            </div>

            <!-- Cours 3 -->
            <div class="card" onclick="selectCard(2)" data-href="cours/probabilite.html">
                <img src="https://images.unsplash.com/photo-1543286386-713bdd548da4?w=600&auto=format&fit=crop&q=80" alt="Probabilité">
                <div class="card-body">
                    <div class="card-title">🎲 Probabilité</div>
                    <div class="card-desc">Variables aléatoires et lois.</div>
                </div>
            </div>

            <!-- Cours 4 -->
            <div class="card" onclick="selectCard(3)" data-href="cours/équa dif.html">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80" alt="Équations Différentielles">
                <div class="card-body">
                    <div class="card-title">📉 Équations Différentielles</div>
                    <div class="card-desc">Systèmes dynamiques et résolutions.</div>
                </div>
            </div>

        </div>

        <footer>
            UBO Brest — Propulsé par GitHub Pages
        </footer>
    </div>

    <script>
        const cards = Array.from(document.querySelectorAll('.card'));
        let activeIndex = 0; 

        function updatePositions() {
            const total = cards.length;
            
            cards.forEach((card, i) => {
                let diff = (i - activeIndex + total) % total;
                
                if (diff === 0) {
                    // Carte au premier plan (centre net)
                    card.style.transform = "translate(0px, 0px) scale(1)";
                    card.style.zIndex = "50";
                    card.style.opacity = "1";
                    card.style.filter = "blur(0px)";
                } else {
                    // Cartes en arrière-plan réparties proprement sur l'ellipse
                    let angle = 0;
                    if (diff === 1) angle = Math.PI / 3;        // Bas droite
                    else if (diff === 2) angle = Math.PI;       // Fond centre
                    else if (diff === 3) angle = (2 * Math.PI) / 3; // Bas gauche

                    let radiusX = 250; // Largeur de l'ellipse
                    let radiusY = 70;  // Hauteur de l'ellipse

                    let x = Math.cos(angle) * radiusX;
                    let y = Math.sin(angle) * radiusY - 10;

                    card.style.transform = `translate(${x}px, ${y}px) scale(0.7)`;
                    card.style.zIndex = "10";
                    card.style.opacity = "0.45";
                    card.style.filter = "blur(1.5px)";
                }
            });
        }

        function selectCard(index) {
            if (index === activeIndex) {
                window.location.href = cards[index].getAttribute('data-href');
            } else {
                activeIndex = index;
                updatePositions();
            }
        }

        updatePositions();
    </script>

</body>
</html>
